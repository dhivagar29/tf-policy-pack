name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install OPA
        env:
          OPA_VERSION: "1.22.2"
          # opa_linux_amd64_static from https://github.com/open-policy-agent/opa/releases/tag/v1.22.2
          OPA_SHA256: "24e344d1fc394cd93dc75666f584cfb97c6981f7255af25f8d2979834317317b"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  /tmp/opa" | sha256sum -c -
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version

      - name: Install Conftest
        env:
          CONFTEST_VERSION: "0.71.1"
          # conftest_0.71.1_Linux_x86_64.tar.gz from https://github.com/open-policy-agent/conftest/releases/tag/v0.71.1
          CONFTEST_SHA256: "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
        run: |
          set -euo pipefail
          ASSET="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o /tmp/conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${ASSET}"
          echo "${CONFTEST_SHA256}  /tmp/conftest.tar.gz" | sha256sum -c -
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: OPA unit tests
        run: opa test policy/ data/ -v

      - name: Conftest (good fixture must pass)
        run: conftest test fixtures/plan_good.json -p policy --data data

      - name: Conftest (bad fixture must fail)
        run: |
          set +e
          conftest test fixtures/plan_bad.json -p policy --data data
          code=$?
          set -e
          test "$code" -ne 0

      - name: Playground sync check (JS vs OPA)
        run: node scripts/sync-check.cjs
        env:
          OPA_BIN: /usr/local/bin/opa
